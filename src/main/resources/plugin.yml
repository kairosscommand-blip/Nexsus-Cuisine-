name: NexusCuisine
version: ${project.version}
main: com.nexuscraft.nexuscuisine.NexusCuisinePlugin
api-version: '1.21'
author: RealSociety
description: "A massive overhaul of food, hunger, and cooking, untouched since Beta 1.8. A real furnace/campfire cook rolls a genuine quality tier onto the resulting dish -- baked directly into that dish's own real FoodComponent, not simulated -- driven by a per-player cooking skill that levels up from real cooks. Dishes really spoil over real time (checked the moment they're next touched, never ticked per-item) unless wrapped for real, craftable preservation. Farmer, Butcher, and Fisherman villagers' trades really respond to a server-wide food scarcity index, reusing vanilla's own real trade demand/price fields. An optional, read-only bridge shows a dish's live NexusEconomy shop price when that plugin happens to be installed."

commands:
  nexuscuisine:
    description: Check your cooking skill, inspect a held dish, look up a dish's price, or reload config.
    usage: /nexuscuisine <skill|inspect|price <dish-id>|reload>
    aliases: [cuisine, cook]
    permission: nexuscuisine.use
    permission-message: "§cYou don't have permission to do that."

permissions:
  nexuscuisine.admin:
    description: Reload NexusCuisine's config.
    default: op
  nexuscuisine.use:
    description: Check cooking skill, inspect dishes, and look up prices.
    default: true
